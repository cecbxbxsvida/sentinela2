<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Painel Médico
    </title>

   <style>
       ```css
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f6fb;
    color: #26364a;
}

.container {
    width: 90%;
    max-width: 1100px;
    margin: 40px auto;
}

.header {
    background: #ffffff;
    padding: 30px;
    border-radius: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 5px 18px rgba(42, 62, 88, 0.10);
}

.subtitle {
    color: #607d9b;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
}

.header h1 {
    margin: 8px 0;
    color: #243b53;
}

.header p {
    color: #718096;
}

.status {
    background: #e8f5ee;
    color: #278253;
    padding: 10px 16px;
    border-radius: 20px;
    font-weight: bold;
}

.status-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    background: #35a66f;
    border-radius: 50%;
    margin-right: 7px;
}

.section {
    background: #ffffff;
    margin-top: 25px;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 5px 18px rgba(42, 62, 88, 0.08);
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.tag {
    color: #57748f;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
}

.section-title h2 {
    color: #263b52;
    margin-top: 5px;
}

.refresh-btn {
    border: none;
    background: #e5edf6;
    color: #38536d;
    padding: 11px 18px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}

.refresh-btn:hover {
    background: #d3e0ee;
}

.patient-card {
    background: #f9fbfd;
    border: 1px solid #dce5ee;
    border-radius: 15px;
    padding: 22px;
    margin-bottom: 18px;
}

.patient-top {
    display: flex;
    align-items: center;
    gap: 15px;
}

.patient-avatar {
    width: 48px;
    height: 48px;
    background: #6c8eac;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-weight: bold;
    font-size: 20px;
}

.patient-name {
    flex: 1;
}

.patient-name h3 {
    color: #263b52;
}

.patient-name span {
    color: #7b8794;
    font-size: 13px;
}

.risk {
    padding: 7px 13px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.risco-verde {
    background: #dff3e7;
    color: #28784d;
}

.risco-amarelo {
    background: #fff2c9;
    color: #98720b;
}

.risco-laranja {
    background: #ffe1cc;
    color: #a85a1d;
}

.risco-vermelho {
    background: #f8d9dc;
    color: #a53d48;
}

.risco-azul {
    background: #dbe8f7;
    color: #3e6793;
}

.patient-info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-top: 22px;
}

.patient-info div {
    background: #eef3f8;
    padding: 15px;
    border-radius: 10px;
}

.patient-info span {
    display: block;
    color: #718096;
    font-size: 12px;
    margin-bottom: 6px;
}

.patient-info strong {
    color: #31475d;
}

.observation {
    margin-top: 18px;
    background: #edf2f7;
    padding: 15px;
    border-radius: 10px;
    color: #536579;
}

.attend-btn {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #527da3;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.attend-btn:hover {
    background: #416a8e;
}

.empty {
    text-align: center;
    padding: 50px 20px;
    color: #718096;
}

.empty-icon {
    font-size: 40px;
    margin-bottom: 15px;
}

.empty h3 {
    color: #40566d;
    margin-bottom: 8px;
}

.error {
    background: #fbe5e7;
    color: #a53d48;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
}

footer {
    text-align: center;
    color: #8493a3;
    font-size: 13px;
    margin-top: 25px;
}
```

   </style>

</head>


<body>

<div class="container">


    <header class="header">

        <div>

            <span class="subtitle">
                SISTEMA HOSPITALAR
            </span>

            <h1>
                🩺 Painel Médico
            </h1>

            <p>
                Pacientes aguardando atendimento
            </p>

        </div>


        <div class="status">

            <span class="status-dot"></span>

            Sistema Online

        </div>

    </header>


    <section class="section">


        <div class="section-title">

            <div>

                <span class="tag">
                    ATENDIMENTO
                </span>

                <h2>
                    Pacientes para atender
                </h2>

            </div>


            <button
                class="refresh-btn"
                onclick="carregarPacientes()"
            >

                ↻ Atualizar

            </button>

        </div>


        <div
            id="triagem"
            class="triagem"
        ></div>


    </section>


    <footer>

        Sistema Hospitalar • Painel Médico

    </footer>


</div>


<script>

    async function carregarPacientes() {

        const div =
            document
                .getElementById(
                    "triagem"
                );


        div.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⏳
                </div>

                <h3>
                    Carregando pacientes...
                </h3>

            </div>

        `;


        try {

            const response =
                await fetch(
                    "/triagem"
                );


            if (!response.ok) {

                throw new Error(
                    "Erro ao carregar pacientes."
                );

            }


            const pacientes =
                await response.json();


            div.innerHTML = "";


            if (
                !Array.isArray(pacientes) ||
                pacientes.length === 0
            ) {

                div.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            ✓
                        </div>

                        <h3>
                            Nenhum paciente aguardando
                        </h3>

                        <p>
                            Não existem pacientes
                            aguardando atendimento.
                        </p>

                    </div>

                `;

                return;

            }


            pacientes.forEach(
                paciente => {

                    const risco =
                        String(
                            paciente.risco ||
                            "verde"
                        ).toLowerCase();


                    let classeRisco =
                        "risco-verde";


                    if (
                        risco.includes(
                            "vermelho"
                        )
                    ) {

                        classeRisco =
                            "risco-vermelho";

                    }

                    else if (
                        risco.includes(
                            "amarelo"
                        )
                    ) {

                        classeRisco =
                            "risco-amarelo";

                    }

                    else if (
                        risco.includes(
                            "laranja"
                        )
                    ) {

                        classeRisco =
                            "risco-laranja";

                    }

                    else if (
                        risco.includes(
                            "azul"
                        )
                    ) {

                        classeRisco =
                            "risco-azul";

                    }


                    const nome =
                        paciente.nome ||
                        "Paciente";


                    const sintoma =
                        paciente.sintoma ||
                        "Não informado";


                    const temperatura =
                        paciente.temperatura !== null &&
                        paciente.temperatura !== undefined &&
                        paciente.temperatura !== ""
                            ? paciente.temperatura + " °C"
                            : "Não informada";


                    const alergias =
                        paciente.alergias ||
                        "Nenhuma";


                    const observacao =
                        paciente.observacao ||
                        "Nenhuma";


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "patient-card";


                    card.innerHTML = `

                        <div class="patient-top">

                            <div class="patient-avatar">

                                ${nome
                                    .charAt(0)
                                    .toUpperCase()}

                            </div>


                            <div class="patient-name">

                                <h3>
                                    ${nome}
                                </h3>

                                <span>
                                    Aguardando atendimento
                                </span>

                            </div>


                            <span
                                class="risk ${classeRisco}"
                            >

                                ${paciente.risco}

                            </span>

                        </div>


                        <div class="patient-info">

                            <div>

                                <span>
                                    Sintoma
                                </span>

                                <strong>
                                    ${sintoma}
                                </strong>

                            </div>


                            <div>

                                <span>
                                    Temperatura
                                </span>

                                <strong>
                                    ${temperatura}
                                </strong>

                            </div>


                            <div>

                                <span>
                                    Alergias
                                </span>

                                <strong>
                                    ${alergias}
                                </strong>

                            </div>

                        </div>


                        <div class="observation">

                            <strong>
                                Observações:
                            </strong>

                            <br><br>

                            ${observacao}

                        </div>


                        <button
                            class="attend-btn"
                            onclick="atenderPaciente(${paciente.id})"
                        >

                            🩺 Atender paciente

                        </button>

                    `;


                    div.appendChild(
                        card
                    );

                }
            );


        } catch (error) {

            console.error(
                error
            );


            div.innerHTML = `

                <div class="error">

                    ❌ Não foi possível
                    carregar os pacientes.

                    <br><br>

                    ${error.message}

                </div>

            `;

        }

    }


    function atenderPaciente(id) {

        if (!id) {

            alert(
                "Paciente inválido."
            );

            return;

        }


        window.location.href =
            `/consulta.html?id=${id}`;

    }


    carregarPacientes();

</script>

</body>

</html>
