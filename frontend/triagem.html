<!DOCTYPE html>

<head>

    <title>

    </title>

    <style>
/* ==========================================================================
   CONFIGURAÇÕES GLOBAIS
   ========================================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

    font-family:
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;
}

body {
    background:
        radial-gradient(
            circle at top left,
            #dff6f4 0%,
            #eef8f8 35%,
            #f4f8fb 70%,
            #eaf1f6 100%
        );

    color: #263b45;

    padding: 30px 20px;

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;
}


/* Pequeno detalhe decorativo no fundo */

body::before {
    content: "";
    position: fixed;

    width: 280px;
    height: 280px;

    border-radius: 50%;

    background: rgba(24, 169, 161, 0.08);

    top: -100px;
    right: -80px;

    pointer-events: none;
}

body::after {
    content: "";
    position: fixed;

    width: 220px;
    height: 220px;

    border-radius: 50%;

    background: rgba(27, 115, 155, 0.06);

    bottom: -90px;
    left: -70px;

    pointer-events: none;
}


/* ==========================================================================
   CONTAINER PRINCIPAL
   ========================================================================== */

.container {
    background: rgba(255, 255, 255, 0.96);

    width: 100%;
    max-width: 650px;

    padding: 38px;

    border-radius: 22px;

    box-shadow:
        0 20px 50px rgba(34, 73, 89, 0.12),
        0 5px 15px rgba(34, 73, 89, 0.05);

    border: 1px solid rgba(255, 255, 255, 0.9);

    position: relative;

    overflow: hidden;
}


/* Barra superior */

.container::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 7px;

    background:
        linear-gradient(
            90deg,
            #087f8c,
            #13a8a0,
            #55c9c1
        );
}


/* ==========================================================================
   TÍTULOS
   ========================================================================== */

h2 {
    color: #174b5b;

    font-size: 27px;

    font-weight: 700;

    margin-bottom: 25px;

    text-align: center;

    letter-spacing: -0.5px;

    position: relative;
}


/* Ícone decorativo abaixo do título */

h2::after {
    content: "";

    display: block;

    width: 45px;
    height: 4px;

    margin: 10px auto 0;

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            #087f8c,
            #48c4bd
        );
}


/* ==========================================================================
   CAMPOS
   ========================================================================== */

input,
select,
textarea {
    width: 100%;

    padding: 14px 16px;

    margin-top: 14px;

    border-radius: 11px;

    border: 1px solid #d3e1e6;

    font-size: 15px;

    color: #29414c;

    background-color: #f8fbfc;

    outline: none;

    transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        background-color 0.25s ease,
        transform 0.2s ease;
}


/* Placeholder */

input::placeholder,
textarea::placeholder {
    color: #91a4ad;
}


/* Foco */

input:focus,
select:focus,
textarea:focus {
    background-color: #ffffff;

    border-color: #13a8a0;

    box-shadow:
        0 0 0 4px rgba(19, 168, 160, 0.10),
        0 4px 12px rgba(19, 168, 160, 0.06);
}


/* Hover */

input:hover,
select:hover,
textarea:hover {
    border-color: #a9c8d0;
}


textarea {
    min-height: 115px;

    resize: vertical;
}


/* ==========================================================================
   SELECT
   ========================================================================== */

select {
    cursor: pointer;
}


/* ==========================================================================
   BOTÕES
   ========================================================================== */

button {
    width: 100%;

    padding: 14px 18px;

    margin-top: 24px;

    background:
        linear-gradient(
            135deg,
            #087f8c,
            #13a8a0
        );

    color: #ffffff;

    border: none;

    border-radius: 11px;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        filter 0.2s ease;

    box-shadow:
        0 6px 15px rgba(8, 127, 140, 0.20);
}


button:hover {
    filter: brightness(1.05);

    transform: translateY(-2px);

    box-shadow:
        0 9px 20px rgba(8, 127, 140, 0.25);
}


button:active {
    transform: translateY(0);

    box-shadow:
        0 3px 8px rgba(8, 127, 140, 0.18);
}


/* ==========================================================================
   RESULTADO DA CLASSIFICAÇÃO
   ========================================================================== */

#resultado {
    margin-top: 22px;

    padding: 16px;

    border-radius: 12px;

    text-align: center;

    font-weight: 700;

    font-size: 14px;

    display: none;

    text-transform: uppercase;

    letter-spacing: 0.5px;

    animation: aparecer 0.3s ease;
}


#resultado.verde,
#resultado.amarelo,
#resultado.vermelho {
    display: block;
}


/* ==========================================================================
   RISCO VERDE
   ========================================================================== */

.verde {
    background:
        linear-gradient(
            135deg,
            #e6f8f0,
            #d8f3e7
        );

    color: #087443;

    border: 1px solid #a8dfc2;

    box-shadow:
        0 5px 14px rgba(8, 116, 67, 0.08);
}


/* ==========================================================================
   RISCO AMARELO
   ========================================================================== */

.amarelo {
    background:
        linear-gradient(
            135deg,
            #fff8df,
            #fff3c4
        );

    color: #876500;

    border: 1px solid #ead58a;

    box-shadow:
        0 5px 14px rgba(135, 101, 0, 0.07);
}


/* ==========================================================================
   RISCO VERMELHO
   ========================================================================== */

.vermelho {
    background:
        linear-gradient(
            135deg,
            #fff0f0,
            #ffe2e2
        );

    color: #b42323;

    border: 1px solid #efb2b2;

    box-shadow:
        0 5px 14px rgba(180, 35, 35, 0.08);
}


/* ==========================================================================
   CARD
   ========================================================================== */

.card {
    border: 1px solid #dce9ed;

    padding: 18px;

    margin: 18px 0;

    border-radius: 14px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f8fcfd
        );

    box-shadow:
        0 5px 15px rgba(38, 75, 88, 0.06);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
}


.card:hover {
    transform: translateY(-2px);

    border-color: #b9d9dd;

    box-shadow:
        0 9px 22px rgba(38, 75, 88, 0.09);
}


/* ==========================================================================
   ANIMAÇÃO
   ========================================================================== */

@keyframes aparecer {

    from {
        opacity: 0;
        transform: translateY(-6px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* ==========================================================================
   RESPONSIVIDADE
   ========================================================================== */

@media (max-width: 650px) {

    body {
        padding: 20px 12px;
    }

    .container {
        padding: 28px 20px;

        border-radius: 18px;
    }

    h2 {
        font-size: 23px;
    }

    input,
    select,
    textarea {
        font-size: 14px;
    }

    button {
        font-size: 14px;
    }

}

<body>

    <div class="container">

        <h2>
            Triagem Hospitalar
        </h2>


        <input
            id="nome"
            placeholder="Nome completo do paciente"
        >


        <select id="sintoma">

            <option value="">
                Selecione o sintoma principal
            </option>

            <option value="dor_leve">
                Dor leve
            </option>

            <option value="resfriado">
                Resfriado
            </option>

            <option value="coriza">
                Coriza
            </option>

            <option value="tosse">
                Tosse
            </option>

            <option value="febre">
                Febre
            </option>

            <option value="dor_cabeca">
                Dor de cabeça
            </option>

            <option value="dor_garganta">
                Dor de garganta
            </option>

            <option value="fadiga">
                Fadiga
            </option>

            <option value="enjoo">
                Enjoo
            </option>

            <option value="falta_ar">
                Falta de ar
            </option>

            <option value="tontura">
                Tontura
            </option>

            <option value="calafrios">
                Calafrios
            </option>

            <option value="espirros">
                Espirros
            </option>

            <option value="dor_muscular">
                Dor muscular
            </option>

            <option value="dor_articulacao">
                Dor nas articulações
            </option>

            <option value="azia">
                Azia
            </option>

            <option value="vomito">
                Vômito
            </option>

            <option value="diarreia">
                Diarreia
            </option>

            <option value="prisao_ventre">
                Prisão de ventre
            </option>

            <option value="coceira">
                Coceira
            </option>

            <option value="alergia">
                Alergia
            </option>

            <option value="pele_irritada">
                Pele irritada
            </option>

            <option value="olhos_vermelhos">
                Olhos vermelhos
            </option>

            <option value="lacrimejamento">
                Lacrimejamento
            </option>

            <option value="perda_apetite">
                Perda de apetite
            </option>

            <option value="insonia">
                Insônia
            </option>

            <option value="ansiedade">
                Ansiedade
            </option>

            <option value="pressao_alta">
                Pressão alta
            </option>

            <option value="pressao_baixa">
                Pressão baixa
            </option>

            <option value="palpitacao">
                Palpitação
            </option>

            <option value="dor_peito">
                Dor no peito
            </option>

            <option value="infarto">
                Dor no peito / Suspeita de Infarto
            </option>

            <option value="avc">
                Suspeita de AVC
            </option>

            <option value="convulsão">
                Convulsão
            </option>

            <option value="hemorragia">
                Hemorragia
            </option>

            <option value="falta_ar_grave">
                Falta de ar grave
            </option>

        </select>


        <input
            type="number"
            id="temp"
            placeholder="Temperatura (°C)"
            step="0.1"
        >


        <input
            id="alergias"
            placeholder="Alergias (se houver)"
        >


        <textarea
            id="observacao"
            placeholder="Observações médicas adicionais..."
        ></textarea>


        <div id="resultado"></div>


        <button onclick="salvar()">
            Salvar Triagem
        </button>

    </div>


<script>

    function classificarRisco(
        sintoma,
        temperatura
    ) {

        const vermelhos = [

            "infarto",

            "avc",

            "convulsão",

            "hemorragia",

            "falta_ar_grave"

        ];


        const amarelos = [

            "febre",

            "vomito",

            "diarreia",

            "falta_ar",

            "tontura",

            "dor_peito",

            "pressao_alta",

            "pressao_baixa",

            "palpitacao"

        ];


        if (
            vermelhos.includes(sintoma)
        ) {

            return "vermelho";

        }


        if (
            !isNaN(temperatura) &&
            temperatura >= 39
        ) {

            return "vermelho";

        }


        if (
            amarelos.includes(sintoma)
        ) {

            return "amarelo";

        }


        if (
            !isNaN(temperatura) &&
            temperatura >= 38
        ) {

            return "amarelo";

        }


        return "verde";

    }


    async function salvar() {

        const nome =
            document
                .getElementById("nome")
                .value
                .trim();


        const sintoma =
            document
                .getElementById("sintoma")
                .value;


        const temperatura =
            Number(
                document
                    .getElementById("temp")
                    .value
            );


        const alergias =
            document
                .getElementById("alergias")
                .value
                .trim();


        const observacao =
            document
                .getElementById("observacao")
                .value
                .trim();


        if (!nome) {

            alert(
                "Digite o nome do paciente."
            );

            return;

        }


        if (!sintoma) {

            alert(
                "Selecione o sintoma principal."
            );

            return;

        }


        const risco =
            classificarRisco(
                sintoma,
                temperatura
            );


        try {

            const response =
                await fetch(
                    "/triagem",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            nome:
                                nome,

                            sintoma:
                                sintoma,

                            temperatura:
                                temperatura,

                            alergias:
                                alergias,

                            observacao:
                                observacao,

                            risco:
                                risco

                        })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.erro ||
                    "Erro ao salvar triagem."
                );

            }


            const resultado =
                document
                    .getElementById(
                        "resultado"
                    );


            resultado.className =
                risco;


            resultado.innerHTML =
                "Classificação de Risco: " +
                risco.toUpperCase();


            alert(
                "✓ Triagem salva com sucesso!"
            );


            document
                .getElementById("nome")
                .value = "";


            document
                .getElementById("sintoma")
                .value = "";


            document
                .getElementById("temp")
                .value = "";


            document
                .getElementById("alergias")
                .value = "";


            document
                .getElementById("observacao")
                .value = "";


        } catch (error) {

            console.error(
                "Erro ao salvar:",
                error
            );


            alert(
                "Erro ao conectar com o servidor.\n\n" +
                error.message
            );

        }

    }

</script>

</body>

</html>
